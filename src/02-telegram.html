<!doctype html>
<html><head><meta charset="utf-8"><title>02 — Link your Telegram</title>
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="light.css"><link rel="stylesheet" href="screens.css">
</head>
<body>
<div class="canvas light">
  <div class="lgrid" style="-webkit-mask-image:radial-gradient(75% 45% at 50% 85%, #000 0%, rgba(0,0,0,.3) 60%, transparent 100%)"></div>
  <div data-deco="cloud" class="z-back" style="left:-75px;top:700px;width:150px;height:75px"></div>
  <div data-deco="cloud" class="z-back" style="left:372px;top:880px;width:140px;height:70px"></div>
  <div data-deco="path" class="z-front" data-d="M-10 560 C 30 540, 10 500, 20 470" style="inset:0"></div>

  <div class="device ti lg" data-k="device" style="left:42px;top:-56px;transform:rotate(-5deg)">
    <div class="app" data-screen="connectTelegram"></div>
  </div>

  <div data-deco="plane3d" class="z-front" style="left:4px;top:388px;width:150px;height:109px;transform:rotate(-10deg)"></div>

  <div class="pop otp" style="left:150px;top:300px;width:266px;transform:rotate(4deg)">
    <div class="ot">Verify Telegram<i data-ic="tg" style="width:22px;height:22px"></i></div>
    <div class="os">Enter the verification code sent to you.</div>
    <div class="boxes"><span>4</span><span>8</span><span>2</span><span>1</span><span class="on">3</span></div>
  </div>
  <div data-deco="sparkle" class="z-front" style="left:398px;top:284px;width:22px;height:22px"></div>

  <div class="head" style="top:736px">
    <div class="hl">Link Your<br><em>Telegram</em></div>
    <div class="sl">Sign in with your Telegram number, then pick the channels to copy.</div>
  </div>
</div>
<script src="screens.js"></script><script src="deco.js"></script><script src="kit.js"></script>
</body></html>
