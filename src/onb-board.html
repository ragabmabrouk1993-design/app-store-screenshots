<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face { font-family: Aeonik; font-weight: 700; src: url(../../../src/assets/fonts/fonnts.com-Aeonik-Bold.ttf); }
@font-face { font-family: Aeonik; font-weight: 400; src: url(../../../src/assets/fonts/fonnts.com-Aeonik-Regular.ttf); }
html,body{margin:0;width:2400px;height:1000px;background:#060B16;font-family:Aeonik}
.top{position:absolute;left:90px;top:60px;display:flex;align-items:center;gap:36px}
.icon{width:180px;height:180px;border-radius:42px;background:url(app-icon.png) center/cover;box-shadow:0 0 0 1.5px rgba(110,160,255,.28),0 24px 50px -18px rgba(0,0,0,.7)}
.t b{display:block;font:700 120px/1 Aeonik;letter-spacing:-.04em;background:linear-gradient(90deg,#FFFFFF 0%,#FFFFFF 45%,#6E7C99 100%);-webkit-background-clip:text;color:transparent}
.t span{display:block;margin-top:14px;font:400 30px/1 Aeonik;color:#8C98B0}
.card{position:absolute;left:60px;right:60px;top:300px;bottom:60px;border-radius:44px;background:#0C1428;box-shadow:inset 0 0 0 1px rgba(110,160,255,.14),0 30px 60px -30px rgba(0,0,0,.6)}
.rows{position:absolute;left:100px;right:100px;top:400px;display:flex;justify-content:space-between}
.row{display:flex;gap:14px}
.row.ar{flex-direction:row-reverse}
.row img{width:200px;height:433.1px;border-radius:24px;border-radius:30px;box-shadow:0 0 0 1px rgba(110,160,255,.16),0 18px 30px -16px rgba(0,0,0,.6)}
.tags{position:absolute;right:100px;top:120px;display:flex;gap:48px;text-align:center;color:#fff}
.tags div small{display:block;font:400 18px/1 Aeonik;letter-spacing:.06em;color:#8C98B0;text-transform:uppercase}
.tags div b{display:block;margin-top:12px;font:700 34px/1 Aeonik}
</style></head><body>
<!-- Onboarding board (for sharing, not an App Store asset): English on the left, Arabic on the right, running right to left -->
<div class="top"><div class="icon"></div><div class="t"><b>Tragram</b><span>Onboarding · 5 screens · 1125 × 2436</span></div></div>
<div class="tags"><div><small>Screens</small><b>5</b></div><div><small>Language</small><b>EN · AR</b></div></div>
<div class="card"></div>
<div class="rows">
  <div class="row"><img src="../out/onb/01-signals.png"><img src="../out/onb/02-link-telegram.png"><img src="../out/onb/03-channels.png"><img src="../out/onb/04-connect.png"><img src="../out/onb/05-rules.png"></div>
  <div class="row ar"><img src="../out/onb-ar/01-signals.png"><img src="../out/onb-ar/02-link-telegram.png"><img src="../out/onb-ar/03-channels.png"><img src="../out/onb-ar/04-connect.png"><img src="../out/onb-ar/05-rules.png"></div>
</div>
</body></html>
