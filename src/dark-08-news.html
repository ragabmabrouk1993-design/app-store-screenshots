<!doctype html>
<html><head><meta charset="utf-8"><title>Dark · 08 — Stay ahead of the news</title>

<style>
  .evc { left: 12px; top: 452px; width: 380px; padding: 0 18px 20px; border-radius: 26px; transform: rotate(-3deg); }

  .evc .vals { margin-top: 12px; display: flex; border: 1px solid #2A2A2E; border-radius: 10px; padding: 11px 0; }
  .evc .vals div { flex: 1; text-align: center; font: 400 15px/1.4 Aeonik; color: var(--text); }
  .evc .vals div + div { border-left: 1px solid #2A2A2E; }
  .evc .c-bad { color: var(--bad) !important; } .evc .c-good { color: var(--good) !important; }

</head>
