  </div>

  <div class="notif" style="left:18px;top:328px;width:404px">

    <div class="nt">

  <div data-deco="sparkle" class="z-front" style="left:30px;top:250px;width:20px;height:20px"></div>
  <div data-deco="plane3d" class="z-front" style="left:336px;top:812px;width:104px;height:76px;transform:rotate(-14deg)"></div>
</div>
